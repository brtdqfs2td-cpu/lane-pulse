<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lane Pulse — My Summary</title>
<meta name="description" content="Your practice summaries, synced from your coach's device.">
<meta name="theme-color" content="#128064">
<link rel="icon" href="icons/swimmer-512.png" type="image/png">
<link rel="apple-touch-icon" href="icons/swimmer-192.png">
<style>
  /* Self-hosted fonts (Manrope variable + IBM Plex Mono statics, latin subset) —
     keeps the app working offline and off Google's network entirely. */
  @font-face {
    font-family: 'Manrope';
    font-style: normal;
    font-weight: 500 800;
    font-display: swap;
    src: url('fonts/manrope-variable.woff2') format('woff2-variations'),
         url('fonts/manrope-variable.woff2') format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }
  @font-face {
    font-family: 'IBM Plex Mono';
    font-style: normal;
    font-weight: 400;
    font-display: swap;
    src: url('fonts/ibm-plex-mono-400.woff2') format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }
  @font-face {
    font-family: 'IBM Plex Mono';
    font-style: normal;
    font-weight: 600;
    font-display: swap;
    src: url('fonts/ibm-plex-mono-600.woff2') format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }
  @font-face {
    font-family: 'IBM Plex Mono';
    font-style: normal;
    font-weight: 700;
    font-display: swap;
    src: url('fonts/ibm-plex-mono-700.woff2') format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }

  :root {
    color-scheme: light;
    --page: #f6f9f8;
    --surface: #ffffff;
    --surface-2: #eef3f1;
    --ink: #0b1210;
    --ink-secondary: #4b5854;
    --ink-muted: #7c8985;
    --hairline: rgba(11, 18, 16, 0.12);
    --accent: #128064;
    --accent-soft: rgba(18, 128, 100, 0.10);
    --critical: #c02f2f;
    --critical-soft: rgba(208, 59, 59, 0.10);
    --shadow: 0 1px 2px rgba(11, 18, 16, 0.04), 0 8px 24px -16px rgba(11, 18, 16, 0.18);
    --font-ui: 'Manrope', system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, "SFMono-Regular", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page: #080d0c;
      --surface: #0f1615;
      --surface-2: #15201e;
      --ink: #f2f6f4;
      --ink-secondary: #b7c3bf;
      --ink-muted: #7f8c88;
      --hairline: rgba(255, 255, 255, 0.09);
      --accent: #35c795;
      --accent-soft: rgba(53, 199, 149, 0.16);
      --critical: #e66767;
      --critical-soft: rgba(230, 103, 103, 0.16);
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px -16px rgba(0, 0, 0, 0.6);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #080d0c;
    --surface: #0f1615;
    --surface-2: #15201e;
    --ink: #f2f6f4;
    --ink-secondary: #b7c3bf;
    --ink-muted: #7f8c88;
    --hairline: rgba(255, 255, 255, 0.09);
    --accent: #35c795;
    --accent-soft: rgba(53, 199, 149, 0.16);
    --critical: #e66767;
    --critical-soft: rgba(230, 103, 103, 0.16);
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px -16px rgba(0, 0, 0, 0.6);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--page);
    color: var(--ink);
    font-family: var(--font-ui);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

  .wrap {
    max-width: 640px;
    margin: 0 auto;
    padding: 28px 20px 72px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .brand-eyebrow {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.11em;
    text-transform: uppercase;
    color: var(--accent);
  }
  .brand-title {
    font-size: 24px;
    font-weight: 800;
    letter-spacing: -0.01em;
    margin: 2px 0 0;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--hairline);
    border-radius: 14px;
    box-shadow: var(--shadow);
    padding: 18px 20px;
  }

  .tiles {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 12px;
  }
  .tile {
    background: var(--surface);
    border: 1px solid var(--hairline);
    border-radius: 12px;
    padding: 14px 16px;
  }
  .tile-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-muted);
  }
  .tile-value {
    font-family: var(--font-mono);
    font-size: 22px;
    font-weight: 600;
    margin-top: 6px;
    font-variant-numeric: tabular-nums;
  }

  .practice-block { border: 1px solid var(--hairline); border-radius: 10px; overflow: hidden; }
  .practice-block + .practice-block { margin-top: 12px; }
  .practice-block-head {
    display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap;
    padding: 10px 14px; background: var(--surface-2); font-size: 12px; color: var(--ink-secondary);
  }
  .practice-block-head strong { color: var(--ink); font-weight: 700; }
  .practice-metrics {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(80px, 1fr)); gap: 10px;
    padding: 12px 14px;
  }
  .practice-metric-item { text-align: center; }
  .practice-metric-value {
    font-family: var(--font-mono); font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums;
  }
  .practice-metric-label { font-size: 10.5px; color: var(--ink-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-top: 2px; }

  .state-message {
    text-align: center; color: var(--ink-muted); font-size: 13.5px; padding: 40px 20px;
  }
  .state-message strong { display: block; color: var(--ink); font-size: 16px; margin-bottom: 6px; }

  footer.note {
    font-size: 12px; color: var(--ink-muted); text-align: center; line-height: 1.6;
    padding-top: 6px;
  }
</style>
</head>
<body>
<div class="wrap">

  <div>
    <div class="brand-eyebrow">Lane Pulse</div>
    <h1 class="brand-title" id="pageTitle">My Summary</h1>
  </div>

  <div id="content">
    <div class="state-message"><strong>Loading&hellip;</strong></div>
  </div>

  <footer class="note">
    This link is personal to you &mdash; don&rsquo;t share it. Data here comes from your coach&rsquo;s
    device once it&rsquo;s synced, so it may lag a bit behind an actual practice.
  </footer>

</div>

<script>
(function () {
  "use strict";

  var API_BASE_URL = "https://lane-pulse-api.lanepulse.workers.dev";

  var el = {
    pageTitle: document.getElementById("pageTitle"),
    content: document.getElementById("content")
  };

  function formatDuration(startIso, endIso) {
    if (!startIso || !endIso) return null;
    var ms = new Date(endIso).getTime() - new Date(startIso).getTime();
    if (!(ms > 0)) return null;
    var totalMin = Math.round(ms / 60000);
    return totalMin + " min";
  }

  function metricItem(value, label) {
    if (value === null || value === undefined) return "";
    var v = (typeof value === "number") ? Math.round(value * 10) / 10 : value;
    return '<div class="practice-metric-item">' +
      '<div class="practice-metric-value">' + v + '</div>' +
      '<div class="practice-metric-label">' + label + '</div>' +
      '</div>';
  }

  function renderError(message) {
    el.content.innerHTML = '<div class="card"><div class="state-message"><strong>' + message + '</strong>' +
      'Ask your coach for a fresh link if this keeps happening.</div></div>';
  }

  function renderSummary(data) {
    var swimmer = data.swimmer;
    var practices = data.practices || [];
    el.pageTitle.textContent = swimmer.name;

    var tiles = '<div class="tiles">' +
      metricTile(swimmer.baselineMaxHr, "Max HR") +
      metricTile(swimmer.baselineRestingHr, "Resting HR") +
      metricTile(swimmer.age, "Age") +
      '</div>';

    var practicesHtml;
    if (!practices.length) {
      practicesHtml = '<div class="card"><div class="state-message"><strong>No practices yet</strong>' +
        'Once your coach syncs a practice, it&rsquo;ll show up here.</div></div>';
    } else {
      practicesHtml = practices.map(function (p) {
        var d = new Date(p.session_date);
        var dateStr = d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
        var duration = formatDuration(p.start_time, p.end_time);
        var metrics =
          metricItem(p.avg_bpm, "avg bpm") +
          metricItem(p.max_bpm, "peak bpm") +
          metricItem(p.min_bpm, "low bpm") +
          metricItem(p.hrv_rmssd, "hrv ms");
        return '<div class="practice-block">' +
          '<div class="practice-block-head"><strong>' + dateStr + '</strong>' +
          (p.location ? '<span>' + p.location + '</span>' : '') +
          (duration ? '<span>' + duration + '</span>' : '') +
          '</div>' +
          '<div class="practice-metrics">' + metrics + '</div>' +
          '</div>';
      }).join("");
    }

    el.content.innerHTML = tiles + '<div>' + practicesHtml + '</div>';
  }

  function metricTile(value, label) {
    return '<div class="tile"><div class="tile-label">' + label + '</div>' +
      '<div class="tile-value">' + (value === null || value === undefined ? "&mdash;" : value) + '</div></div>';
  }

  function init() {
    var token = new URLSearchParams(window.location.search).get("token");
    if (!token) {
      renderError("No link token found");
      return;
    }
    fetch(API_BASE_URL + "/swimmer/" + encodeURIComponent(token) + "/summary")
      .then(function (res) {
        if (res.status === 404) throw new Error("This link isn't recognized");
        if (!res.ok) throw new Error("Something went wrong (HTTP " + res.status + ")");
        return res.json();
      })
      .then(renderSummary)
      .catch(function (err) {
        renderError(err.message || "Couldn't load your summary");
      });
  }
  init();
})();
</script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("service-worker.js")
        .catch(function () { /* offline caching unavailable — app still works online */ });
    });
  }
</script>
</body>
</html>
